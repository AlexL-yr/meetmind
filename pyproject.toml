[project]
name = "meetingtruth"
version = "0.1.0"
description = "MeetingTruth — ethics audit system for AI-powered meeting summarization."
authors = [
    { name = "AlexL-yr" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-google-genai>=2.0.0",
    "anthropic>=0.40.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-ollama>=0.2.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest>=8.3.5", "anyio>=4.7.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["UP006", "UP007", "UP035", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
